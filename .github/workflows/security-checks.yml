name: Security Checks

on:
  push:
  pull_request:

jobs:
  asvs-guardrails:
    name: ASVS Guardrails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore StudentInformationSystem.slnx

      - name: Build
        run: dotnet build StudentInformationSystem.slnx --no-restore --configuration Release

      - name: Run ASVS guardrail tests
        run: >
          dotnet test SIS.Tests/SIS.Tests.csproj
          --no-build
          --configuration Release
          --filter "FullyQualifiedName~SecurityGuardrailTests|FullyQualifiedName~StartupSecurityValidatorTests|FullyQualifiedName~FileUploadValidationTests"
          --verbosity normal

  dependency-scan:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore .NET packages
        run: dotnet restore StudentInformationSystem.slnx

      - name: .NET vulnerable package audit
        run: |
          dotnet list StudentInformationSystem.slnx package --vulnerable --include-transitive --format json > "$RUNNER_TEMP/dotnet-vulnerable.json"
          cat "$RUNNER_TEMP/dotnet-vulnerable.json"
          if grep -Eq '"severity":[[:space:]]*"(High|Critical)"' "$RUNNER_TEMP/dotnet-vulnerable.json"; then
            echo "::error::High or Critical vulnerable NuGet package found (see JSON above)"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: SIS.Web/package-lock.json

      - name: Install frontend dependencies
        working-directory: SIS.Web
        run: npm ci

      - name: Node dependency audit
        working-directory: SIS.Web
        run: node ../scripts/npm-audit-kapisi.mjs
