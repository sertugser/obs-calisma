name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release --warnaserror

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal

  backend-coverage:
    name: Backend Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release --warnaserror

      - name: Run tests with coverage
        run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ExcludeByFile="**/Migrations/**/*.cs"

      - name: Coverage summary
        run: |
          files=$(find . -name coverage.cobertura.xml -path '*/TestResults/*' | sort)
          if [ -z "$files" ]; then echo "Kapsam dosyası bulunamadı" >&2; exit 1; fi
          attr() { grep -o -m1 "$2=\"[^\"]*\"" "$1" | head -1 | cut -d'"' -f2; }
          pct() { awk -v r="$1" 'BEGIN { printf "%.1f", r * 100 }'; }
          {
            echo "## Backend kapsam özeti"
            for f in $files; do
              echo "### $f"
              echo "- Satır: %$(pct "$(attr "$f" line-rate)") ($(attr "$f" lines-covered) / $(attr "$f" lines-valid) satır)"
              echo "- Dal: %$(pct "$(attr "$f" branch-rate)") ($(attr "$f" branches-covered) / $(attr "$f" branches-valid) dal)"
              grep -o '<package name="[^"]*" line-rate="[^"]*"' "$f" | awk -F'"' '{ printf "- %s: %%%.1f\n", $2, $4 * 100 }'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: '**/TestResults/**/coverage.cobertura.xml'
          retention-days: 7

  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: SIS.Web/package-lock.json

      - name: Install dependencies
        working-directory: SIS.Web
        run: npm ci

      - name: Lint
        working-directory: SIS.Web
        run: npm run lint

      - name: Type check
        working-directory: SIS.Web
        run: npx tsc --noEmit

      - name: Build
        working-directory: SIS.Web
        run: npm run build

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: SIS.Web/dist/
          retention-days: 14

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: SIS.Web/package-lock.json

      - name: Install dependencies
        working-directory: SIS.Web
        run: npm ci

      - name: NPM audit
        working-directory: SIS.Web
        run: node ../scripts/npm-audit-kapisi.mjs

      - name: Check for secrets in code
        run: |
          echo "Scanning for potential secrets..."
          # Fail if any new secrets patterns are found in tracked files
          if git grep -lE '(password|secret|apikey)\s*[:=]\s*["\x27][^"\x27]{8,}' -- '*.cs' '*.ts' '*.tsx' '*.json' \
             | grep -v appsettings.json \
             | grep -v SeedData.cs \
             | grep -v '*.example'; then
            echo "::warning::Potential secrets found in source code"
          fi
